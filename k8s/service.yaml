# Internal ClusterIP service (used by the Ingress and in-cluster clients)
apiVersion: v1
kind: Service
metadata:
  name: btc-api
  namespace: btc-mlops
spec:
  type: ClusterIP
  selector:
    app: btc-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
# External NodePort service: http://<node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: btc-api-nodeport
  namespace: btc-mlops
spec:
  type: NodePort
  selector:
    app: btc-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
