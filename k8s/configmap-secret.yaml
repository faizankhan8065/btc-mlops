apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  namespace: btc-mlops
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  GUNICORN_WORKERS: "2"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  namespace: btc-mlops
type: Opaque
# Demo value only. In a real cluster create it with:
#   kubectl -n btc-mlops create secret generic btc-api-secret --from-literal=API_KEY=<value>
stringData:
  API_KEY: "change-me-demo-key"
  COINGECKO_API_KEY: ""
