# Local integration environment: Flask API + Airflow (webserver, scheduler) + Postgres.
#   docker compose up -d --build
#   API      -> http://localhost:5000/health
#   Airflow  -> http://localhost:8080  (admin / admin)
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.10
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    _PIP_ADDITIONAL_REQUIREMENTS: "yfinance>=0.2.54 scikit-learn==1.5.1"
    PROJECT_DIR: /opt/project
    MODEL_DIR: /opt/project/models
    BTC_API_URL: http://btc-api:5000
    API_KEY: ${API_KEY:-local-dev-key}
    MAPE_THRESHOLD: ${MAPE_THRESHOLD:-10}
    ALLOW_SYNTHETIC: ${ALLOW_SYNTHETIC:-0}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/project/src
    - ./data:/opt/project/data
    - models:/opt/project/models
  user: "0:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname a --lastname b
               --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  btc-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: btc-forecast-api:local
    environment:
      MODEL_DIR: /app/models
      MODEL_STAGE: staging
      LOG_LEVEL: INFO
      API_KEY: ${API_KEY:-local-dev-key}
    ports: ["5000:5000"]
    volumes:
      - models:/app/models

volumes:
  pgdata:
  models:
